server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + OAuth endpoints to the backend service so cookies stay same-site
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
    }

    # Host is pinned to the backend's externally-reachable address (not $host, which
    # drops the port) so Spring computes an OAuth2 redirect_uri that matches what's
    # registered in Google Cloud Console: http://localhost:8080/login/oauth2/code/google
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host localhost:8080;
    }

    location /login/ {
        proxy_pass http://backend:8080/login/;
        proxy_set_header Host localhost:8080;
    }
}
