<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="roofglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FA0B5"/>
      <stop offset="100%" stop-color="#C9C4B8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#roofglow)"/>
  <!-- sloped ceiling beams -->
  <polygon points="0,0 800,0 800,160 400,280 0,160" fill="#8B5E3C" opacity="0.9"/>
  <line x1="200" y1="60" x2="400" y2="280" stroke="#6B4A2E" stroke-width="10"/>
  <line x1="600" y1="60" x2="400" y2="280" stroke="#6B4A2E" stroke-width="10"/>
  <!-- bed under the eaves -->
  <rect x="140" y="440" width="520" height="200" rx="20" fill="#6B705C"/>
  <rect x="140" y="440" width="520" height="50" rx="20" fill="#FAF7F2"/>
  <rect x="180" y="380" width="120" height="90" rx="16" fill="#FAF7F2"/>
  <rect x="120" y="640" width="24" height="80" fill="#8B5E3C"/>
  <rect x="656" y="640" width="24" height="80" fill="#8B5E3C"/>
</svg>
