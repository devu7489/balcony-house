<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E7DFD3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7DFD3"/>
      <stop offset="60%" stop-color="#D8A15E"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#wall)"/>
  <!-- balcony doorway with sunrise view -->
  <rect x="460" y="120" width="280" height="500" rx="8" fill="url(#sky)"/>
  <circle cx="600" cy="330" r="60" fill="#FAF7F2" opacity="0.9"/>
  <polygon points="460,480 560,360 640,480" fill="#2B2B29" opacity="0.6"/>
  <polygon points="560,500 660,340 740,500" fill="#2B2B29" opacity="0.7"/>
  <rect x="460" y="120" width="280" height="500" rx="8" fill="none" stroke="#8B5E3C" stroke-width="14"/>
  <line x1="600" y1="120" x2="600" y2="620" stroke="#8B5E3C" stroke-width="10"/>
  <!-- bed -->
  <rect x="70" y="430" width="330" height="150" rx="16" fill="#6B705C"/>
  <rect x="70" y="430" width="330" height="40" rx="16" fill="#FAF7F2"/>
  <rect x="90" y="380" width="90" height="70" rx="14" fill="#FAF7F2"/>
  <rect x="60" y="560" width="20" height="60" fill="#8B5E3C"/>
  <rect x="380" y="560" width="20" height="60" fill="#8B5E3C"/>
</svg>
