<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7DFD3"/>
      <stop offset="100%" stop-color="#D8C9B4"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A15E"/>
      <stop offset="100%" stop-color="#6B705C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#wall)"/>
  <!-- window with pine valley view -->
  <rect x="440" y="100" width="300" height="360" rx="8" fill="url(#valley)"/>
  <polygon points="440,380 520,260 600,380" fill="#2B2B29" opacity="0.6"/>
  <polygon points="560,400 640,240 720,400" fill="#2B2B29" opacity="0.7"/>
  <rect x="440" y="100" width="300" height="360" rx="8" fill="none" stroke="#8B5E3C" stroke-width="14"/>
  <!-- reading nook: chair + shelf -->
  <rect x="90" y="420" width="150" height="180" rx="20" fill="#8B5E3C"/>
  <rect x="110" y="380" width="110" height="70" rx="16" fill="#8B5E3C"/>
  <rect x="90" y="580" width="150" height="26" rx="8" fill="#2B2B29" opacity="0.5"/>
  <rect x="280" y="480" width="140" height="220" fill="#6B705C" opacity="0.85"/>
  <rect x="292" y="500" width="116" height="16" fill="#FAF7F2"/>
  <rect x="292" y="540" width="116" height="16" fill="#FAF7F2"/>
  <rect x="292" y="580" width="116" height="16" fill="#FAF7F2"/>
  <rect x="292" y="620" width="116" height="16" fill="#FAF7F2"/>
</svg>
