<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7DFD3"/>
      <stop offset="55%" stop-color="#D8A15E"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sky1)"/>
  <circle cx="400" cy="260" r="90" fill="#FAF7F2" opacity="0.9"/>
  <g fill="#2B2B29" opacity="0.55">
    <polygon points="0,560 120,360 240,560"/>
    <polygon points="560,580 700,320 800,580"/>
  </g>
  <!-- balcony railing -->
  <rect x="0" y="600" width="800" height="200" fill="#6B705C"/>
  <g stroke="#FAF7F2" stroke-width="10" opacity="0.8">
    <line x1="0" y1="610" x2="800" y2="610"/>
    <line x1="60" y1="610" x2="60" y2="800"/>
    <line x1="200" y1="610" x2="200" y2="800"/>
    <line x1="340" y1="610" x2="340" y2="800"/>
    <line x1="480" y1="610" x2="480" y2="800"/>
    <line x1="620" y1="610" x2="620" y2="800"/>
    <line x1="760" y1="610" x2="760" y2="800"/>
  </g>
  <!-- coffee cup on ledge -->
  <rect x="330" y="560" width="140" height="40" rx="6" fill="#8B5E3C"/>
  <ellipse cx="400" cy="560" rx="46" ry="16" fill="#FAF7F2"/>
  <ellipse cx="400" cy="556" rx="34" ry="10" fill="#6B4A2E"/>
</svg>
