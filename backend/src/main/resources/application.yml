server:
  port: 8080
  # Trusts X-Forwarded-Host/-Proto/-Port from the reverse proxy (Caddy) so Spring
  # computes the OAuth2 redirect_uri from the real public domain, not the internal
  # container address - works for any domain without hardcoding one anywhere.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: BALCONYSESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}     # set true behind HTTPS in production
        same-site: lax

spring:
  application:
    name: balcony-house-backend

  session:
    store-type: redis
    redis:
      namespace: balconyhouse:session
      flush-mode: on_save

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:balconyhouse}
    username: ${DB_USER:balconyhouse}
    password: ${DB_PASSWORD:balconyhouse}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-emails: ${ADMIN_EMAILS:}

  # Everything that makes this deployment "this" hotel rather than another one. Re-skinning
  # the app for a new client is meant to start and end with editing this block (and swapping
  # the image files it points at) - see HotelConfig/HotelSeeder for how it's applied.
  hotel:
    name: ${HOTEL_NAME:The Balcony House}
    tagline: ${HOTEL_TAGLINE:Stay a little longer.}
    branding:
      logo-url: ${HOTEL_LOGO_URL:}
      hero-image-url: ${HOTEL_HERO_IMAGE_URL:/images/hero/balcony-sunrise.png}
    contact:
      email: ${HOTEL_CONTACT_EMAIL:hello@thebalconyhouse.com}
      phone: ${HOTEL_CONTACT_PHONE:+91 00000 00000}
      address: ${HOTEL_ADDRESS:}
    addons:
      childcare-enabled: ${HOTEL_CHILDCARE_ENABLED:true}
      full-board-enabled: ${HOTEL_FULL_BOARD_ENABLED:true}
    rooms:
      - slug: sunrise-room
        name: The Sunrise Room
        description: A warm, sunlit room with an oversized private balcony facing the eastern ridge. Perfect for slow mornings and mountain coffee.
        price-per-night: 3000.00
        max-guests: 2
        private-balcony: true
        workspace-available: true
        hero-image-url: /images/rooms/sunrise-room.svg
        total-units: 4
        highlights: []
      - slug: pinewood-suite
        name: The Pinewood Suite
        description: Spacious suite with wood interiors, a reading nook, and views over the pine valley below.
        price-per-night: 3500.00
        max-guests: 3
        private-balcony: true
        workspace-available: true
        hero-image-url: /images/rooms/pinewood-suite.svg
        total-units: 4
        highlights: []
      - slug: mist-cottage
        name: The Mist Cottage
        description: A standalone cottage tucked against the tree line, quiet and private, with a fireplace for cool evenings.
        price-per-night: 4000.00
        max-guests: 4
        private-balcony: true
        workspace-available: false
        hero-image-url: /images/rooms/mist-cottage.svg
        total-units: 4
        highlights: []

  # Base rates live per-property (they genuinely differ per room, see app.hotel.rooms above);
  # everything here is the shared, tunable math applied on top of those bases.
  pricing:
    room:
      mid-stay-ratio: ${ROOM_MID_STAY_RATIO:0.80}       # 6-10 nights
      long-stay-ratio: ${ROOM_LONG_STAY_RATIO:0.60}     # 11+ nights
      peak-season-multiplier: ${ROOM_PEAK_MULTIPLIER:1.5}
      peak-season-months: ${ROOM_PEAK_MONTHS:4,5,6}     # April-June (kids' summer holidays)
    childcare:
      short-stay-rate: ${CHILDCARE_SHORT_STAY_RATE:600}   # per child/day, <=5 nights
      mid-stay-rate: ${CHILDCARE_MID_STAY_RATE:500}       # per child/day, 6-10 nights
      long-stay-rate: ${CHILDCARE_LONG_STAY_RATE:400}     # per child/day, 11+ nights
    full-board:
      price-per-person-per-day: ${FULL_BOARD_RATE:500}

logging:
  level:
    com.thebalconyhouse.backend: INFO
    org.springframework.security: INFO
